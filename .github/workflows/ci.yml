name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MOONBIT_VERSION: latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore MoonBit Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moon-deps-${{ hashFiles('moon.mod.json') }}
          restore-keys: moon-deps-

      - name: Install MoonBit CLI
        run: |
          INSTALL_SUCCESS=false
          for i in 1 2 3; do
            if curl -fsSL https://cli.moonbitlang.com/install.sh | bash; then
              INSTALL_SUCCESS=true
              break
            fi
            echo "::warning::MoonBit CLI installation failed, retry ${i}..."
            sleep 5
          done

          if [ "$INSTALL_SUCCESS" = true ]; then
            echo "$HOME/.moon/bin" >> $GITHUB_PATH
          else
            echo "::error::MoonBit CLI installation failed after all retries"
            exit 1
          fi

      - name: Verify MoonBit Installation & Install Dependencies
        run: |
          moon version
          moon install

      - name: Run moon check
        run: moon check

      - name: Run moon build
        run: moon build

      - name: Run moon test
        run: moon test
