name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MOONBIT_VERSION: latest

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore MoonBit Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moon-deps-${{ hashFiles('moon.mod') }}
          restore-keys: moon-deps-

      - name: Install MoonBit CLI
        run: |
          MOONBIT_INSTALL_URL="https://cli.moonbitlang.com/install/unix.sh"
          MOONBIT_INSTALL_SCRIPT="/tmp/moonbit-install.sh"
          INSTALL_SUCCESS=false

          for i in 1 2 3; do
            if curl -fsSL -o "$MOONBIT_INSTALL_SCRIPT" "$MOONBIT_INSTALL_URL" && bash "$MOONBIT_INSTALL_SCRIPT"; then
              export PATH="$HOME/.moon/bin:$PATH"
              if moon version; then
                echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
                INSTALL_SUCCESS=true
                break
              else
                echo "::warning::moon version verification failed (attempt ${i}/3)"
              fi
            else
              echo "::warning::MoonBit CLI installation failed (attempt ${i}/3)"
            fi
            sleep 5
          done

          if [ "$INSTALL_SUCCESS" = false ]; then
            echo "::error::MoonBit CLI installation failed after all retries"
            exit 1
          fi

      - name: Update Registry Index
        run: |
          moon version
          moon update

      - name: Run moon check
        run: moon check --deny-warn

      - name: Run moon build
        run: moon build

      - name: Run moon test
        run: moon test --deny-warn

      - name: Check command table consistency
        run: python3 scripts/check_docs.py

      - name: Run moon bench
        run: |
          moon bench | tee bench_output.txt
          python3 scripts/check_bench.py bench_output.txt

      - name: Check library coverage
        run: |
          moon coverage analyze -- -f summary | tee coverage.txt
          python3 - <<'PY'
          import re
          import sys

          covered = 0
          total = 0
          for line in open("coverage.txt", encoding="utf-8"):
              match = re.match(r"lib/[^:]+: (\d+)/(\d+)", line)
              if match:
                  covered += int(match.group(1))
                  total += int(match.group(2))
          percent = covered * 100.0 / total if total else 0.0
          print(f"lib coverage: {covered}/{total} ({percent:.1f}%)")
          if percent < 88.0:
              print("library coverage is below the 88% threshold")
              sys.exit(1)
          PY

  cross-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm-gc]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore MoonBit Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moon-deps-${{ hashFiles('moon.mod') }}
          restore-keys: moon-deps-

      - name: Install MoonBit CLI
        run: |
          MOONBIT_INSTALL_URL="https://cli.moonbitlang.com/install/unix.sh"
          MOONBIT_INSTALL_SCRIPT="/tmp/moonbit-install.sh"
          for i in 1 2 3; do
            if curl -fsSL -o "$MOONBIT_INSTALL_SCRIPT" "$MOONBIT_INSTALL_URL" && bash "$MOONBIT_INSTALL_SCRIPT"; then
              export PATH="$HOME/.moon/bin:$PATH"
              if moon version; then
                echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
                break
              fi
            fi
            sleep 5
          done

      - name: Check target ${{ matrix.target }}
        run: moon check --deny-warn --target ${{ matrix.target }}
